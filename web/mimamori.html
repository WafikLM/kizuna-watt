<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veille mimamori — Kizuna Watt</title>
<script>try{var t=localStorage.getItem("kw-theme");document.documentElement.dataset.theme=t==="light"||t==="dark"?t:"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<script>try{var l=localStorage.getItem("kw-lang")||"fr";if(/^(en|ar|ja)$/.test(l)){document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";document.write('<script src="/static/i18n/'+l+'.js"><\/script>')}}catch(e){}</script>
<link rel="icon" href="/static/logo-icon.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
<style>
  .mm { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .mmc { width: 100%; max-width: 460px; text-align: center; padding: 30px 26px 26px; }
  .mmc .lg { height: 64px; margin-bottom: 4px; }
  .mmc h1 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); font-weight: 650; margin-bottom: 18px; }
  .badge-big { width: 132px; height: 132px; border-radius: 50%; margin: 6px auto 18px; display: grid; place-items: center; color: #fff; font-size: 56px; background: var(--c, #1db97c); box-shadow: 0 0 0 10px rgb(var(--cc, 29 185 124) / .18), 0 18px 40px rgb(var(--cc, 29 185 124) / .4); animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.04); } }
  .mmc .nm { font-size: 28px; font-weight: 560; letter-spacing: -.02em; } .mmc .st { font-size: 18px; margin: 6px 0 4px; font-weight: 650; } .mmc .dt { color: var(--mut); font-size: 14px; }
  .mmc .ja { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--mut); font-size: 13px; }
  .mmc .note { margin-top: 16px; font-size: 11.5px; color: var(--mut2); }
</style>
</head>
<body>
<div class="mm"><div class="glass mmc" id="card">
  <div style="text-align:right"><select class="langsel" id="mmLang" data-novalidate><option value="fr">Français</option><option value="en">English</option><option value="ar">العربية</option><option value="ja">日本語</option></select></div>
  <img class="lg logo-l" src="/static/logo-icon.png" alt="Kizuna Watt"><img class="lg logo-d" src="/static/logo-icon-dark.png" alt="">
  <h1>見守り · Mimamori</h1>
  <div id="body"><p class="sub">Chargement…</p></div>
  <div class="note">Cette page indique seulement si une activite electrique est detectee dans le foyer. Elle ne montre jamais la consommation ni le detail des appareils.</div>
</div></div>
<script src="/static/i18n.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const tok = new URLSearchParams(location.search).get("t") || "";
const hm = (ts) => new Date(ts * 1000).toLocaleString((window.KW_LANGS ? KW_LANGS[KW_LANG].loc : "fr-FR"), { weekday: "long", hour: "2-digit", minute: "2-digit" });
const V = {
  ok: ["#1db97c", "29 185 124", "✓", "Tout va bien", "異常なし · 普段どおりです"],
  attention: ["#f2a516", "242 165 22", "!", "Activite plus tardive que d'habitude", "いつもより活動が遅れています"],
  alert: ["#ea5455", "234 84 85", "!", "Aucune activite : merci de l'appeler", "活動が確認できません · ご連絡ください"],
  paused: ["#8ea3b0", "142 163 176", "⏸", "Veille suspendue (voyage ou pause)", "見守り一時停止中"],
  learning: ["#8ea3b0", "142 163 176", "…", "Apprentissage du rythme en cours", "生活リズムを学習中"],
  offline: ["#8ea3b0", "142 163 176", "?", "Capteur hors ligne : impossible de juger", "センサーがオフラインです"],
};
async function load() {
  let r; try { r = await fetch("/api/mimamori/public?t=" + encodeURIComponent(tok)); } catch (e) { return; }
  if (!r.ok) { $("body").innerHTML = '<p class="st">Lien invalide ou veille desactivee.</p><p class="sub">リンクが無効か、見守りが無効です。</p>'; return; }
  const d = await r.json(), v = V[d.state] || V.learning; const c = $("card"); c.style.setProperty("--c", v[0]); c.style.setProperty("--cc", v[1]);
  $("body").innerHTML = `<div class="badge-big">${v[2]}</div><div class="nm">${d.name}</div><div class="st">${v[3]}</div>
    <div class="dt">${d.last_active_ts ? "Derniere activite : " + hm(d.last_active_ts) : ""}${d.gap_h != null && d.state !== "ok" ? "<br>Sans activite depuis " + d.gap_h.toFixed(0) + " h (habituel : jusqu'a " + d.typical_h.toFixed(0) + " h)" : ""}${d.paused_until ? "<br>Suspendue jusqu'au " + new Date(d.paused_until * 1000).toLocaleDateString((window.KW_LANGS ? KW_LANGS[KW_LANG].loc : "fr-FR")) : ""}</div>
    <div class="ja">${v[4]}</div><div class="dt" style="margin-top:8px">Mis a jour a ${new Date(d.now * 1000).toLocaleTimeString((window.KW_LANGS ? KW_LANGS[KW_LANG].loc : "fr-FR"), { hour: "2-digit", minute: "2-digit" })}</div>`;
}
if ($("mmLang")) { $("mmLang").value = window.KW_LANG || "fr"; $("mmLang").onchange = () => { try { localStorage.setItem("kw-lang", $("mmLang").value); } catch (e) {} location.reload(); }; }
load(); setInterval(load, 15000);
</script>
</body>
</html>
