<text x="30" y="752" font-size="12.5" text-anchor="start" fill="#333" font-weight="normal">Reglages :  ARD1 > Program File = kizuna_sensor.ino.hex (export de l'IDE Arduino)  ·  COMPIM > Physical port = COM5, 9600 bauds</text>
<text x="30" y="770" font-size="12.5" text-anchor="start" fill="#333" font-weight="normal">+5V = mode Terminals > POWER (nom « +5V »)  ·  GND = mode Terminals > GROUND.  Les broches A2-A5, 0, 2-12 restent libres.</text>
<text x="30" y="788" font-size="12.5" text-anchor="start" fill="#333" font-weight="normal">Pont Python cote PC : python tools/serial_bridge.py --port COM6 ... (COM5 et COM6 = paire com0com)</text>
